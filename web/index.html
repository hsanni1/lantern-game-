<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Komorebi Village · A Village Walk</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body><main id="village" tabindex="0" aria-label="Village walking game" data-kimono-model="./assets/kimono-boy.glb"></main>
<header><span class="eyebrow">Komorebi Village</span><h1 id="place">Adventure Market</h1><p id="hint" role="status">Find the mandarin stall</p><p id="purse"></p></header>
<nav aria-label="Choose a village style"><button data-world="market" aria-pressed="true">Market</button><button data-world="minka">Minka</button><button data-world="golden">Golden hour</button></nav>
<div id="status" role="status">Opening village…</div><button id="buy" hidden>Buy mandarin · 3 mon · E</button>
<details class="village-map" open>
  <summary><svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m2 5 6-2 8 3 6-2v15l-6 2-8-3-6 2z M8 3v15 M16 6v15"/></svg> Village map</summary>
  <svg id="minimap" viewBox="-26 -20 52 40" role="img" aria-label="Map showing your position and heading, both river crossings, the market, temple and home">
    <rect x="-26" y="-20" width="52" height="40" fill="#bcc2a0"/>
    <g class="map-ground"></g>
    <g class="map-labels"><text x="23" y="-16">N</text><text x="12" y="-2.8">Market</text><text x="-4" y="-6.3">Temple</text><text x="-14" y="-.8">Home</text></g>
    <g class="map-player"><circle r="1.75" fill="#fcf5dd"/><path d="M0 1.8 -1.1 -1.2 0 -.75 1.1 -1.2Z" fill="#933d29" stroke="#612d27" stroke-width=".14"/></g>
  </svg>
</details>
<aside class="keyboard-hint">W / S &nbsp; Walk <i>·</i> A / D &nbsp; Turn <i>·</i> Shift &nbsp; Run</aside>
<aside class="touch-hint">Drag up to walk · Drag sideways to turn</aside>
<script type="module" id="village-entry">import('./main.js');</script></body></html>
